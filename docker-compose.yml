

services:
  postgres:
    image: postgres:15
    container_name: olist_postgres
    environment:
      POSTGRES_DB: tikibook_db
      POSTGRES_USER: tikibook
      POSTGRES_PASSWORD: tikibook
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
     # - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikibook -d tikibook_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl:
    build: .
    container_name: olist_etl
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "-m", "src.cli", "--log-level", "INFO"]

volumes:
  postgres_data:
